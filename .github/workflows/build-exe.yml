name: build-exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cài PyInstaller
        run: python -m pip install pyinstaller==6.11.1
      - name: Đóng gói exe
        run: >
          pyinstaller --onefile --name ContentFactory
          --add-data "app/ui;ui"
          --add-data "config/humanizer_rules.md;config"
          --add-data "colab;colab"
          app/main.py
      - uses: actions/upload-artifact@v4
        with:
          name: ContentFactory-windows
          path: dist/ContentFactory.exe
      - name: Đính kèm vào Release (khi đẩy tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ContentFactory.exe